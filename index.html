<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NERD Self Registration Portal</title>

<style>
:root{
  --green:#159447;
  --deep:#063c2e;
  --dark:#062b22;
  --light:#f5f7f6;
  --text:#202124;
  --muted:#60656b;
  --blue:#2475c9;
  --border:#dfe4e2;
  --danger:#c62828;
  --warning:#8a6400;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
  font-family:Arial,Helvetica,sans-serif;
  color:var(--text);
  background:#f6f8f7;
}

button,input,select,textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

a{
  color:inherit;
}

.view{
  display:none;
  min-height:100vh;
}

.view.active{
  display:block;
}

/* =========================
   LANDING
========================= */

#landing{
  color:#fff;
  background:
    linear-gradient(180deg,rgba(2,35,25,.76),rgba(0,69,44,.82)),
    radial-gradient(circle at 15% 20%,rgba(40,145,95,.20),transparent 32%),
    repeating-linear-gradient(
      90deg,
      rgba(255,255,255,.035) 0 1px,
      transparent 1px 34px
    ),
    linear-gradient(120deg,#071f18,#063b2b 48%,#092b21);
}

.landing-wrap{
  max-width:900px;
  margin:auto;
  min-height:100vh;
  padding:22px 20px 40px;
  display:flex;
  flex-direction:column;
}

.brandbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
}

.brand img{
  width:62px;
  height:62px;
  object-fit:cover;
  border-radius:50%;
  background:#fff;
}

.brand-name{
  font-size:38px;
  font-weight:800;
  letter-spacing:2px;
}

.brand-sub{
  font-size:8px;
  letter-spacing:.5px;
  margin-top:-4px;
}

.menu{
  width:64px;
  height:58px;
  border:0;
  border-radius:10px;
  background:#16a95c;
  color:white;
  font-size:31px;
}

.hero{
  text-align:center;
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
}

.pill{
  margin-top:76px;
  max-width:820px;
  width:100%;
  padding:22px 24px;
  border-radius:60px;
  background:rgba(65,91,75,.58);
  font-size:21px;
  letter-spacing:1px;
}

.hero h1{
  font-size:62px;
  line-height:1.05;
  margin:72px 0 0;
  font-weight:800;
}

.hero h1 span{
  color:#12b86a;
  display:block;
}

.hero p{
  font-size:20px;
  line-height:1.65;
  max-width:720px;
  margin:50px auto 58px;
  color:#f1f4f2;
}

.cta,.secondary{
  width:min(720px,100%);
  min-height:108px;
  border:0;
  border-radius:12px;
  padding:18px 28px;
  font-size:23px;
  color:#fff;
}

.cta{
  background:linear-gradient(135deg,#24b966,#12a957);
  box-shadow:0 6px 18px rgba(0,0,0,.16);
}

.secondary{
  margin-top:24px;
  background:rgba(40,79,63,.66);
}

.cta span{
  float:right;
  font-size:34px;
}

/* =========================
   APP / LOGIN
========================= */

.app{
  min-height:100vh;
  background:#f5f7f8;
}

.toplinks{
  display:flex;
  justify-content:space-between;
  padding:24px 24px 18px;
  max-width:1000px;
  margin:auto;
  font-size:20px;
  color:#2475c9;
}

.toplinks button{
  background:none;
  border:0;
  color:#2475c9;
  font-size:20px;
}

.card{
  width:min(640px,calc(100% - 36px));
  margin:20px auto 40px;
  background:#fff;
  border-radius:13px;
  box-shadow:0 3px 15px rgba(0,0,0,.09);
  padding:40px 46px;
}

.login-logo{
  display:block;
  width:96px;
  height:96px;
  border-radius:50%;
  object-fit:cover;
  margin:0 auto 18px;
}

.card h2{
  text-align:center;
  font-size:30px;
  margin:0 0 42px;
}

.field{
  margin:0 0 24px;
}

.field label{
  display:block;
  font-size:20px;
  margin-bottom:10px;
}

.field input,
.field select,
.field textarea{
  width:100%;
  min-height:58px;
  border:2px solid #e1e4e3;
  border-radius:10px;
  padding:12px 16px;
  background:#fff;
  outline:none;
}

.field textarea{
  resize:vertical;
  min-height:120px;
}

.field input:focus,
.field select:focus,
.field textarea:focus{
  border-color:#7fb5ed;
  box-shadow:0 0 0 5px rgba(96,160,232,.23);
}

.password-row{
  display:flex;
}

.password-row input{
  border-radius:10px 0 0 10px;
}

.eye{
  width:72px;
  border:2px solid #8b9496;
  border-left:0;
  background:white;
  border-radius:0 10px 10px 0;
  color:#737b7e;
  font-size:24px;
}

.primary{
  width:100%;
  height:60px;
  border:0;
  border-radius:10px;
  background:#168e52;
  color:#fff;
  font-size:23px;
}

.link{
  text-align:right;
  color:#2475c9;
  font-size:19px;
  margin:24px 0 36px;
  border:0;
  background:none;
}

.notice{
  text-align:center;
  color:#5e6368;
  font-size:18px;
  line-height:1.55;
}

.footer{
  text-align:center;
  color:#62686b;
  font-size:18px;
  line-height:1.6;
  margin-top:42px;
}

/* =========================
   REGISTRATION
========================= */

.reg-card{
  width:min(760px,calc(100% - 28px));
  margin:22px auto 50px;
  background:#fff;
  border:1px solid #e3e7e5;
  border-radius:10px;
  box-shadow:0 2px 9px rgba(0,0,0,.07);
  padding:0 18px 34px;
}

.reg-title{
  color:#1d7959;
  font-size:23px;
  font-weight:700;
  padding:18px 0;
  border-bottom:1px solid #e4e7e5;
}

.steps{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin:24px 0;
}

.step{
  border:0;
  background:#f5f5f5;
  border-radius:9px;
  padding:15px 8px;
  color:#333;
}

.step.active{
  background:#eaf7f1;
  color:#137f50;
  font-weight:700;
}

.form-panel{
  border:1px solid #d9dfdc;
  border-radius:15px;
  padding:25px;
  box-shadow:0 1px 4px rgba(0,0,0,.04);
}

.form-panel h3{
  color:#167b54;
  font-size:23px;
  margin:0 0 22px;
}

.form-panel .field label{
  font-size:16px;
  font-weight:600;
}

.form-panel .field input,
.form-panel .field select,
.form-panel .field textarea{
  min-height:50px;
  font-size:16px;
}

.actions{
  display:flex;
  gap:12px;
  margin-top:25px;
}

.actions button{
  flex:1;
  height:50px;
  border-radius:7px;
  border:0;
}

.back{
  background:#edf0ef;
}

.next{
  background:#159447;
  color:white;
}

.success{
  border:1px solid #d8dfdc;
  border-radius:15px;
  padding:24px;
  box-shadow:0 1px 4px rgba(0,0,0,.04);
}

.success h3{
  color:#177c57;
  font-size:22px;
  margin:0 0 20px;
}

.success p{
  font-size:16px;
  line-height:1.55;
  margin:0 0 18px;
}

.small-green{
  border:0;
  background:#159447;
  color:white;
  border-radius:7px;
  padding:12px 18px;
}

/* =========================
   PAYMENT
========================= */

.payment-box{
  border:1px solid #d9dfdc;
  border-radius:15px;
  padding:25px;
  box-shadow:0 1px 4px rgba(0,0,0,.04);
}

.payment-amount{
  font-size:34px;
  font-weight:800;
  color:#167b54;
  text-align:center;
  margin:10px 0 20px;
}

.payment-note{
  background:#f7faf8;
  border-radius:10px;
  padding:15px;
  line-height:1.6;
  color:#555;
  margin:15px 0 22px;
}

.status{
  display:inline-block;
  padding:7px 12px;
  border-radius:20px;
  background:#fff4d8;
  color:#8a6400;
  font-size:13px;
  font-weight:700;
}

.status.paid{
  background:#eaf7f1;
  color:#137f50;
}

/* =========================
   UPLOAD
========================= */

.upload-box{
  border:2px dashed #cdd8d3;
  border-radius:12px;
  padding:22px;
  text-align:center;
  background:#fafcfb;
}

.upload-box input[type=file]{
  width:100%;
  margin-top:14px;
}

/* =========================
   CLEARANCE
========================= */

.clearance-card{
  border:1px solid #d9dfdc;
  border-radius:15px;
  padding:25px;
  box-shadow:0 1px 4px rgba(0,0,0,.04);
}

.clearance-header{
  text-align:center;
  border-bottom:1px solid #e1e6e3;
  padding-bottom:20px;
  margin-bottom:20px;
}

.clearance-header h2{
  margin:0 0 8px;
  color:#14794f;
}

.clearance-header p{
  margin:4px 0;
  color:#62686b;
}

.clearance-row{
  display:flex;
  justify-content:space-between;
  gap:15px;
  padding:13px 0;
  border-bottom:1px solid #edf0ef;
}

.clearance-row strong{
  color:#333;
}

.clearance-status{
  display:flex;
  align-items:center;
  gap:8px;
  color:#137f50;
  font-weight:700;
}

.check{
  width:24px;
  height:24px;
  border-radius:50%;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  background:#159447;
  color:#fff;
}

.final-clearance{
  margin-top:24px;
  padding:20px;
  border-radius:12px;
  background:#eaf7f1;
  border:1px solid #bfe2d0;
  text-align:center;
}

.final-clearance h3{
  color:#137f50;
  margin:0 0 8px;
}

.print-btn{
  width:100%;
  height:55px;
  margin-top:22px;
  border:0;
  border-radius:9px;
  background:#159447;
  color:#fff;
  font-size:19px;
}

/* =========================
   RECEIPT / CLEARANCE
========================= */

.receipt{
  background:#fff;
  border:1px solid #d9dfdc;
  padding:30px;
  max-width:700px;
  margin:auto;
}

.receipt-logo{
  display:block;
  width:80px;
  height:80px;
  border-radius:50%;
  object-fit:cover;
  margin:0 auto 12px;
}

.receipt-title{
  text-align:center;
  color:#116c49;
  margin-bottom:25px;
}

.receipt-title h1{
  margin:0;
  font-size:26px;
}

.receipt-title p{
  margin:5px 0;
  color:#666;
}

.receipt-table{
  width:100%;
  border-collapse:collapse;
  margin-top:15px;
}

.receipt-table td{
  padding:12px 8px;
  border-bottom:1px solid #e4e8e6;
  vertical-align:top;
}

.receipt-table td:first-child{
  width:38%;
  font-weight:700;
}

.clearance-stamp{
  margin:28px auto;
  width:190px;
  height:70px;
  border:3px solid #159447;
  border-radius:8px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#159447;
  font-weight:800;
  font-size:22px;
  transform:rotate(-3deg);
}

.signature-area{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:40px;
  margin-top:50px;
}

.signature{
  border-top:1px solid #555;
  padding-top:8px;
  text-align:center;
  color:#555;
}

.hidden{
  display:none!important;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:600px){

  .landing-wrap{
    padding:18px 16px 30px;
  }

  .brand img{
    width:54px;
    height:54px;
  }

  .brand-name{
    font-size:30px;
  }

  .menu{
    width:55px;
    height:52px;
  }

  .pill{
    margin-top:52px;
    font-size:16px;
    padding:18px 14px;
  }

  .hero h1{
    font-size:43px;
    margin-top:62px;
  }

  .hero p{
    font-size:16px;
    margin:40px 10px;
  }

  .cta,.secondary{
    min-height:88px;
    font-size:18px;
  }

  .cta span{
    font-size:28px;
  }

  .toplinks{
    font-size:15px;
    padding:18px 14px;
  }

  .toplinks button{
    font-size:15px;
  }

  .card{
    padding:32px 28px;
  }

  .card h2{
    font-size:26px;
  }

  .reg-card{
    padding:0 12px 25px;
  }

  .steps{
    gap:6px;
  }

  .step{
    font-size:13px;
    padding:13px 5px;
  }

  .form-panel{
    padding:18px;
  }

  .clearance-row{
    flex-direction:column;
    gap:5px;
  }

  .receipt{
    padding:18px;
  }

  .signature-area{
    grid-template-columns:1fr;
    gap:35px;
  }
}

   PRINT
